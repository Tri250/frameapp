name: Contributor page protection

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: contributor-ownership-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ownership:
    name: Check contributor page ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default-branch commit is trusted. Never check out or run the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject contributor changes to owner-only files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/check_contributor_ownership.py
