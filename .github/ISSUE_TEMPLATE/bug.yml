name: Bug report / 问题反馈
description: Report a reproducible problem / 提供可复现的问题
title: '[Bug] '
body:
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior / 实际与预期表现
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Start from launching the app; redact personal information in screenshots. / 从启动 App 开始描述，截图请脱敏。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OS and app version / 设备、系统和 App 版本
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: Scene and evidence / 场景与证据
      description: For example low light, tilt, occlusion or fast movement. / 如低光、仰俯拍、遮挡或快速移动。
