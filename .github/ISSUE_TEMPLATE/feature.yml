name: Feature request / 改进建议
description: Discuss a concrete photography or development need / 讨论具体的拍照或开发需求
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Expected behavior / 期望的使用方式
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: How you can help (optional) / 你愿意参与的工作（可选）
